<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Planner</title>
  <style>
    :root {
      --primary:  #1e3a5f;
      --accent:   #3b82f6;
      --success:  #10b981;
      --warning:  #f59e0b;
      --danger:   #ef4444;
      --bg:       #f1f5f9;
      --card:     #ffffff;
      --text:     #1e293b;
      --muted:    #64748b;
      --border:   #e2e8f0;
      --radius:   8px;
      --shadow:   0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0 }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh }

    /* ── Header ── */
    header { background:var(--primary); color:#fff; padding:0 16px; display:flex; align-items:center; gap:16px; height:52px; position:sticky; top:0; z-index:50; box-shadow:0 2px 8px rgba(0,0,0,.25) }
    .logo { font-weight:700; font-size:16px; white-space:nowrap; letter-spacing:-.3px; flex-shrink:0 }
    nav { display:flex; gap:2px; overflow-x:auto; flex:1; -webkit-overflow-scrolling:touch }
    nav::-webkit-scrollbar { display:none }
    nav button { background:transparent; border:none; color:rgba(255,255,255,.65); padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px; white-space:nowrap; transition:background .15s,color .15s; font-weight:500; min-height:36px }
    nav button:hover  { color:#fff; background:rgba(255,255,255,.12) }
    nav button.active { color:#fff; background:rgba(255,255,255,.22) }

    /* Header action buttons */
    .hdr-actions { display:flex; gap:4px; flex-shrink:0 }
    .hdr-btn { background:rgba(255,255,255,.1); border:none; color:white; border-radius:6px; width:36px; height:36px; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; transition:background .15s }
    .hdr-btn:hover  { background:rgba(255,255,255,.22) }
    .hdr-btn.active { background:rgba(255,255,255,.3) }

    /* ── Layout ── */
    main { max-width:1100px; margin:0 auto; padding:24px 20px 60px }
    .tab-panel        { display:none }
    .tab-panel.active { display:block }

    /* ── Cards ── */
    .card { background:var(--card); border-radius:var(--radius); border:1px solid var(--border); padding:18px; box-shadow:var(--shadow) }
    .card-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); margin-bottom:8px }

    /* ── Section header ── */
    .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px }
    .section-header h2 { font-size:21px; font-weight:700; letter-spacing:-.3px }

    /* ── Dashboard ── */
    .dash-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px }
    .stat-value { font-size:36px; font-weight:800; line-height:1; margin-bottom:4px }
    .stat-sub { font-size:12px; color:var(--muted) }
    .countdown-big { font-size:52px; font-weight:800; color:var(--accent); line-height:1 }
    .countdown-label { font-size:13px; color:var(--muted); margin-top:4px }
    .dash-details { display:flex; flex-direction:column; gap:14px }

    /* ── Buttons ── */
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:5px; padding:9px 16px; border-radius:6px; border:none; cursor:pointer; font-size:14px; font-weight:500; transition:filter .15s,background .15s; white-space:nowrap; min-height:40px }
    .btn:hover { filter:brightness(.92) }
    .btn-primary { background:var(--accent); color:#fff }
    .btn-danger  { background:var(--danger); color:#fff }
    .btn-ghost   { background:transparent; border:1px solid var(--border); color:var(--text) }
    .btn-ghost:hover { background:var(--bg); filter:none }
    .btn-sm { padding:5px 11px; font-size:13px; min-height:34px }
    .btn-xs { padding:3px 8px; font-size:12px; min-height:28px }

    /* ── Forms ── */
    .form-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; align-items:flex-end }
    .form-row:last-child { margin-bottom:0 }
    input,select,textarea { border:1px solid var(--border); border-radius:6px; padding:9px 12px; font-size:15px; color:var(--text); background:#fff; outline:none; transition:border-color .15s,box-shadow .15s; min-height:40px }
    input:focus,select:focus,textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(59,130,246,.12) }
    input[type="date"],input[type="time"] { cursor:pointer }
    input[type="checkbox"] { width:20px; height:20px; cursor:pointer; accent-color:var(--success); flex-shrink:0; min-height:0 }
    input[type="number"] { -moz-appearance:textfield }

    /* ── Progress bar ── */
    .progress-bar { height:7px; background:var(--border); border-radius:4px; overflow:hidden }
    .pbar-fill { height:100%; border-radius:4px; transition:width .4s ease }
    .pbar-blue    { background:var(--accent) }
    .pbar-green   { background:var(--success) }
    .pbar-warning { background:var(--warning) }
    .pbar-danger  { background:var(--danger) }

    /* ── Tables ── */
    .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch }
    table { width:100%; border-collapse:collapse }
    th { text-align:left; padding:8px 12px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); border-bottom:2px solid var(--border); white-space:nowrap }
    td { padding:10px 12px; border-bottom:1px solid var(--border); font-size:14px; vertical-align:middle }
    tr:last-child td { border-bottom:none }
    tbody tr:hover td { background:#f8fafc }

    /* ── Badges ── */
    .badge { display:inline-block; padding:2px 8px; border-radius:12px; font-size:12px; font-weight:600 }
    .badge-blue { background:#dbeafe; color:#1d4ed8 }
    .badge-gray { background:#f1f5f9; color:#475569 }

    /* ── Misc ── */
    .divider { border:none; border-top:1px solid var(--border); margin:20px 0 }
    .empty-state { text-align:center; padding:32px 20px; color:var(--muted); font-size:14px }

    /* ── Mini stats ── */
    .stats-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px }
    .stat-mini { flex:1; min-width:80px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; text-align:center; box-shadow:var(--shadow) }
    .stat-mini-val   { font-size:22px; font-weight:800; color:var(--accent) }
    .stat-mini-label { font-size:11px; color:var(--muted); margin-top:2px }

    /* ── Event cards ── */
    .event-list { display:flex; flex-direction:column; gap:10px }
    .event-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow) }
    .event-card.is-next { border-color:var(--accent); background:#eff6ff }
    .event-card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:10px }
    .event-name { font-weight:600; font-size:15px }
    .event-date-sub { font-size:13px; color:var(--muted); margin-top:2px }
    .event-right { display:flex; align-items:center; gap:7px; flex-shrink:0 }
    .event-cd-num   { font-size:26px; font-weight:800; color:var(--accent); line-height:1; text-align:right }
    .event-cd-label { font-size:11px; color:var(--muted); text-align:right; margin-top:1px }

    /* ── Roster ── */
    .roster-body { margin-top:12px; padding-top:12px; border-top:1px solid var(--border) }
    .roster-member { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--border) }
    .roster-member:last-of-type { border-bottom:none }
    .roster-name { flex:1; font-size:14px }

    /* ── Budget ── */
    .cat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; margin-bottom:18px }
    .cat-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:13px 15px; box-shadow:var(--shadow) }
    .cat-card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px }
    .cat-name   { font-weight:600; font-size:14px }
    .cat-amount { font-size:13px; color:var(--muted); margin-bottom:7px }

    /* ── Two-col form grid ── */
    .form-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px }

    /* ── Checklist ── */
    .checklist-section { margin-bottom:18px }
    .checklist-cat-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); margin-bottom:6px }
    .checklist-item { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border) }
    .checklist-item:last-child { border-bottom:none }
    .item-name { flex:1; font-size:14px }
    .item-name.done { text-decoration:line-through; color:var(--muted) }

    /* ── Itinerary ── */
    .itin-schedule { display:flex; flex-direction:column; gap:20px; margin-bottom:24px }
    .itin-day-label { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--primary); padding:6px 0 6px; border-bottom:2px solid var(--border); margin-bottom:4px }
    .itin-item { display:flex; align-items:flex-start; gap:12px; padding:10px 0; border-bottom:1px solid var(--border) }
    .itin-item:last-child { border-bottom:none }
    .itin-time { font-size:13px; font-weight:700; color:var(--accent); width:46px; flex-shrink:0; padding-top:1px; font-variant-numeric:tabular-nums }
    .itin-body { flex:1; min-width:0 }
    .itin-title    { font-weight:600; font-size:14px }
    .itin-location { font-size:12px; color:var(--muted); margin-top:2px }
    .itin-notes    { font-size:12px; color:var(--muted); margin-top:2px; font-style:italic }

    /* ── Community ── */
    .badge-green  { background:#dcfce7; color:#166534 }
    .badge-yellow { background:#fef9c3; color:#854d0e }
    .filter-pills { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px }
    .pill { padding:5px 12px; border-radius:20px; border:1px solid var(--border); background:var(--card); font-size:13px; font-weight:500; cursor:pointer; transition:background .15s,color .15s,border-color .15s; color:var(--muted) }
    .pill.active { background:var(--accent); color:#fff; border-color:var(--accent) }
    .pill:hover:not(.active) { background:var(--bg) }
    .comm-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; margin-bottom:20px }
    .comm-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px }
    .comm-title { font-weight:600; font-size:15px; line-height:1.3 }
    .comm-body  { font-size:13px; color:var(--text); line-height:1.5 }
    .comm-footer { display:flex; align-items:center; justify-content:space-between; margin-top:4px }
    .comm-author { font-size:12px; color:var(--muted) }
    .stars { letter-spacing:1px; font-size:15px; color:#f59e0b }

    /* ── Search overlay ── */
    .search-overlay { position:fixed; inset:0; background:rgba(15,23,42,.7); z-index:300; display:none; align-items:flex-start; justify-content:center; padding:20px 16px; overflow-y:auto }
    .search-overlay.open { display:flex }
    .search-modal { background:white; border-radius:12px; width:100%; max-width:600px; overflow:hidden; box-shadow:0 8px 40px rgba(0,0,0,.3); display:flex; flex-direction:column; max-height:78vh }
    .search-input-wrap { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border); flex-shrink:0 }
    #search-input { flex:1; border:none; font-size:16px; outline:none; color:var(--text); min-width:0; background:transparent }
    #search-input::placeholder { color:var(--muted) }
    #search-results { overflow-y:auto }
    .sg-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); padding:10px 16px 4px; background:var(--bg) }
    .sr-item { display:flex; flex-direction:column; padding:11px 16px; cursor:pointer; border-bottom:1px solid var(--border) }
    .sr-item:hover { background:var(--bg) }
    .sr-item:last-child { border-bottom:none }
    .sr-title { font-weight:600; font-size:14px }
    .sr-meta  { font-size:12px; color:var(--muted); margin-top:2px }

    /* ── Toast ── */
    #toast-container { position:fixed; bottom:20px; right:16px; display:flex; flex-direction:column; gap:8px; z-index:200 }
    .toast { background:#1e293b; color:#fff; padding:10px 16px; border-radius:8px; font-size:14px; max-width:280px; opacity:0; transform:translateY(6px); transition:opacity .2s,transform .2s; box-shadow:0 4px 12px rgba(0,0,0,.2) }
    .toast.show { opacity:1; transform:translateY(0) }
    .toast.ok  { background:#166534 }
    .toast.err { background:#991b1b }

    /* ════ MOBILE ≤ 640px ════ */
    @media(max-width:640px) {
      header { height:auto; padding:10px 14px 6px; flex-wrap:wrap; gap:8px }
      .logo { order:1 }
      .hdr-actions { order:2; margin-left:auto }
      nav { order:3; width:100%; gap:1px; padding-bottom:4px }
      nav button { padding:6px 10px; font-size:12.5px }

      main { padding:14px 12px 48px }
      .section-header h2 { font-size:18px }
      .section-header { margin-bottom:14px }

      .dash-grid { grid-template-columns:1fr 1fr; gap:10px }
      .dash-grid .card { padding:12px }
      .stat-value    { font-size:28px }
      .countdown-big { font-size:38px }

      .form-row { flex-direction:column }
      .form-row > input,
      .form-row > select,
      .form-row > button,
      .form-row > textarea { width:100% !important; min-width:0 !important; max-width:none !important }
      .comm-grid { grid-template-columns:1fr }

      .form-grid-2 { grid-template-columns:1fr }
      .cat-grid    { grid-template-columns:1fr }

      .event-card-top { flex-wrap:wrap }
      .event-right { width:100%; margin-top:10px; justify-content:space-between }

      th,td { padding:8px 8px }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Team Planner</div>
  <nav>
    <button data-tab="dashboard">Dashboard</button>
    <button data-tab="roster">Roster Countdown</button>
    <button data-tab="money">Money Tracker</button>
    <button data-tab="fitness">Fitness Tracker</button>
    <button data-tab="packing">Packing Checklist</button>
    <button data-tab="itinerary">Itinerary</button>
    <button data-tab="community">Community</button>
  </nav>
  <div class="hdr-actions">
    <button class="hdr-btn" id="search-btn" onclick="openSearch()" title="Search (Ctrl+K)">&#9906;</button>
    <button class="hdr-btn" id="notif-btn" onclick="handleNotifBtn()" title="Event reminders">&#128276;</button>
  </div>
</header>

<!-- Search overlay -->
<div id="search-overlay" class="search-overlay" onclick="closeSearchBg(event)">
  <div class="search-modal">
    <div class="search-input-wrap">
      <span style="color:var(--muted);font-size:18px;flex-shrink:0">&#9906;</span>
      <input id="search-input" type="search" placeholder="Search events, expenses, workouts…"
             oninput="onSearch(this.value)" onkeydown="if(event.key==='Escape')closeSearch()">
      <button onclick="closeSearch()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);min-height:0;padding:0 4px">&#10005;</button>
    </div>
    <div id="search-results">
      <div class="empty-state" style="padding:24px">Start typing to search everything…</div>
    </div>
  </div>
</div>

<main>
  <section id="tab-dashboard"  class="tab-panel"></section>
  <section id="tab-roster"     class="tab-panel"></section>
  <section id="tab-money"      class="tab-panel"></section>
  <section id="tab-fitness"    class="tab-panel"></section>
  <section id="tab-packing"    class="tab-panel"></section>
  <section id="tab-itinerary"  class="tab-panel"></section>
  <section id="tab-community"  class="tab-panel"></section>
</main>

<div id="toast-container"></div>

<script>
// ── LocalStorage DB ───────────────────────────────────────────────────────────
const db = {
  _r(k)    { return JSON.parse(localStorage.getItem(k)||'[]') },
  _w(k,v)  { localStorage.setItem(k,JSON.stringify(v)) },
  _id(k)   { const n=(parseInt(localStorage.getItem(k+'_n')||'0'))+1; localStorage.setItem(k+'_n',n); return n },

  getEvents()     { return this._r('tp_ev').sort((a,b)=>a.event_date.localeCompare(b.event_date)) },
  addEvent(o)     { const l=this._r('tp_ev'); const it={id:this._id('tp_ev'),...o,created_at:nowIso()}; l.push(it); this._w('tp_ev',l); return it },
  deleteEvent(id) {
    this._w('tp_ev',  this._r('tp_ev').filter(e=>e.id!==id));
    this._w('tp_ro',  this._r('tp_ro').filter(m=>m.event_id!==id));
    this._w('tp_itin',this._r('tp_itin').filter(i=>i.event_id!==id));
  },

  getRoster(eid)     { return this._r('tp_ro').filter(m=>m.event_id===eid).sort((a,b)=>a.id-b.id) },
  addMember(o)       { const l=this._r('tp_ro'); const it={id:this._id('tp_ro'),...o}; l.push(it); this._w('tp_ro',l); return it },
  updateMember(id,p) { const l=this._r('tp_ro').map(m=>m.id===id?{...m,...p}:m); this._w('tp_ro',l); return l.find(m=>m.id===id) },
  deleteMember(id)   { this._w('tp_ro',this._r('tp_ro').filter(m=>m.id!==id)) },

  getCategories()    { return this._r('tp_cats').sort((a,b)=>a.id-b.id) },
  addCategory(o)     { const l=this._r('tp_cats'); const it={id:this._id('tp_cats'),...o}; l.push(it); this._w('tp_cats',l); return it },
  deleteCategory(id) { this._w('tp_cats',this._r('tp_cats').filter(c=>c.id!==id)); this._w('tp_exp',this._r('tp_exp').map(e=>e.category_id===id?{...e,category_id:null}:e)) },

  getExpenses()    { return this._r('tp_exp').sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id) },
  addExpense(o)    { const l=this._r('tp_exp'); const it={id:this._id('tp_exp'),...o,created_at:nowIso()}; l.push(it); this._w('tp_exp',l); return it },
  deleteExpense(id){ this._w('tp_exp',this._r('tp_exp').filter(e=>e.id!==id)) },

  getWorkouts()    { return this._r('tp_wo').sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id) },
  addWorkout(o)    { const l=this._r('tp_wo'); const it={id:this._id('tp_wo'),...o,created_at:nowIso()}; l.push(it); this._w('tp_wo',l); return it },
  deleteWorkout(id){ this._w('tp_wo',this._r('tp_wo').filter(w=>w.id!==id)) },

  getChecklist()   { return this._r('tp_ck').sort((a,b)=>a.category.localeCompare(b.category)||a.id-b.id) },
  addCheckItem(o)  { const l=this._r('tp_ck'); const it={id:this._id('tp_ck'),...o,packed:0,created_at:nowIso()}; l.push(it); this._w('tp_ck',l); return it },
  toggleItem(id)   { this._w('tp_ck',this._r('tp_ck').map(i=>i.id===id?{...i,packed:i.packed?0:1}:i)) },
  deleteItem(id)   { this._w('tp_ck',this._r('tp_ck').filter(i=>i.id!==id)) },
  clearChecklist() { this._w('tp_ck',[]) },

  getItinerary(eid){ const l=this._r('tp_itin'); return(eid?l.filter(i=>i.event_id===eid):l).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||'')) },
  addItinItem(o)   { const l=this._r('tp_itin'); const it={id:this._id('tp_itin'),...o,created_at:nowIso()}; l.push(it); this._w('tp_itin',l); return it },
  deleteItinItem(id){ this._w('tp_itin',this._r('tp_itin').filter(i=>i.id!==id)) },

  getPosts(cat)  { const l=this._r('tp_comm'); return (cat&&cat!=='all'?l.filter(p=>p.category===cat):l).sort((a,b)=>b.id-a.id) },
  addPost(o)     { const l=this._r('tp_comm'); const it={id:this._id('tp_comm'),...o,created_at:nowIso()}; l.push(it); this._w('tp_comm',l); return it },
  deletePost(id) { this._w('tp_comm',this._r('tp_comm').filter(p=>p.id!==id)) },
};

function catSpent(id){ return db.getExpenses().filter(e=>e.category_id===id).reduce((s,e)=>s+e.amount,0) }
function catName(id) { if(!id) return 'Uncategorized'; const c=db.getCategories().find(c=>c.id===id); return c?c.name:'Uncategorized' }

// ── Utilities ─────────────────────────────────────────────────────────────────
function nowIso()   { return new Date().toISOString() }
function todayStr() { return new Date().toISOString().split('T')[0] }

function weekStart() {
  const d=new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate()-(d.getDay()===0?6:d.getDay()-1));
  return d.toISOString().split('T')[0];
}

function calcStreak(workouts) {
  const days=new Set(workouts.map(w=>w.date));
  const d=new Date(); d.setHours(0,0,0,0);
  let streak=0;
  for(let i=0;i<365;i++){
    const s=d.toISOString().split('T')[0];
    if(days.has(s)){ streak++; d.setDate(d.getDate()-1); }
    else if(i===0){ d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

function esc(s) {
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(s) {
  if(!s) return '—';
  return new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}

function daysUntil(s) {
  const t=new Date(); t.setHours(0,0,0,0);
  return Math.round((new Date(s+'T00:00:00')-t)/86400000);
}

function cdLabel(d) {
  if(d===0)  return 'Today!';
  if(d===1)  return '1 day to go';
  if(d>1)    return `${d} days to go`;
  if(d===-1) return '1 day ago';
  return `${Math.abs(d)} days ago`;
}

function pbarClass(pct) { return pct>90?'pbar-danger':pct>70?'pbar-warning':'pbar-blue' }

function toast(msg,type='') {
  const el=document.createElement('div');
  el.className=`toast ${type}`; el.textContent=msg;
  document.getElementById('toast-container').appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),250); },2800);
}

// ── Tab routing ───────────────────────────────────────────────────────────────
const TABS={
  dashboard:loadDashboard, roster:loadRoster, money:loadMoney,
  fitness:loadFitness,     packing:loadPacking, itinerary:loadItinerary,
  community:loadCommunity,
};

function showTab(name) {
  if(!TABS[name]) name='dashboard';
  document.querySelectorAll('.tab-panel').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('[data-tab]').forEach(el=>el.classList.remove('active'));
  document.getElementById(`tab-${name}`).classList.add('active');
  document.querySelector(`[data-tab="${name}"]`).classList.add('active');
  TABS[name]();
  history.replaceState(null,'',`#${name}`);
}

// ── Search ────────────────────────────────────────────────────────────────────
function openSearch() {
  const o=document.getElementById('search-overlay');
  o.classList.add('open');
  const inp=document.getElementById('search-input');
  inp.value='';
  document.getElementById('search-results').innerHTML='<div class="empty-state" style="padding:24px">Start typing to search everything…</div>';
  setTimeout(()=>inp.focus(),60);
}

function closeSearch() { document.getElementById('search-overlay').classList.remove('open') }
function closeSearchBg(e) { if(e.target===document.getElementById('search-overlay')) closeSearch() }

function onSearch(q) {
  const el=document.getElementById('search-results');
  q=q.trim();
  if(!q){ el.innerHTML='<div class="empty-state" style="padding:24px">Start typing to search everything…</div>'; return; }

  const results=performSearch(q.toLowerCase());
  if(!results.length){ el.innerHTML='<div class="empty-state" style="padding:24px">No results for <strong>'+esc(q)+'</strong></div>'; return; }

  const TAB_LABELS={ event:'Events', roster:'Roster', expense:'Expenses', workout:'Workouts', checklist:'Checklist', itinerary:'Itinerary', community:'Community' };
  const TAB_DEST  ={ event:'roster', roster:'roster', expense:'money', workout:'fitness', checklist:'packing', itinerary:'itinerary', community:'community' };

  const groups={};
  results.forEach(r=>{ (groups[r.type]??=[]).push(r) });

  el.innerHTML=Object.entries(groups).map(([type,items])=>`
    <div class="sg-label">${TAB_LABELS[type]||type}</div>
    ${items.slice(0,6).map(item=>`
      <div class="sr-item" onclick="searchGo('${TAB_DEST[type]}')">
        <div class="sr-title">${esc(item.title)}</div>
        <div class="sr-meta">${esc(item.sub)}</div>
      </div>`).join('')}`).join('');
}

function performSearch(q) {
  const res=[];
  db.getEvents().forEach(ev=>{
    if(ev.name.toLowerCase().includes(q)||(ev.description||'').toLowerCase().includes(q))
      res.push({type:'event', title:ev.name, sub:fmtDate(ev.event_date)});
  });
  db._r('tp_ro').forEach(m=>{
    if(m.name.toLowerCase().includes(q)||(m.role||'').toLowerCase().includes(q)){
      const ev=db.getEvents().find(e=>e.id===m.event_id);
      res.push({type:'roster', title:m.name, sub:(m.role||'Member')+(ev?' · '+ev.name:'')});
    }
  });
  db.getExpenses().forEach(ex=>{
    if(ex.description.toLowerCase().includes(q)||catName(ex.category_id).toLowerCase().includes(q))
      res.push({type:'expense', title:ex.description, sub:`£${ex.amount.toFixed(2)} · ${fmtDate(ex.date)}`});
  });
  db.getWorkouts().forEach(wo=>{
    if(wo.type.toLowerCase().includes(q)||(wo.notes||'').toLowerCase().includes(q))
      res.push({type:'workout', title:`${wo.type} · ${wo.duration_min||0} min`, sub:fmtDate(wo.date)});
  });
  db.getChecklist().forEach(item=>{
    if(item.name.toLowerCase().includes(q)||item.category.toLowerCase().includes(q))
      res.push({type:'checklist', title:item.name, sub:item.category+(item.packed?' · packed':'')});
  });
  db.getItinerary().forEach(it=>{
    if(it.title.toLowerCase().includes(q)||(it.location||'').toLowerCase().includes(q)||(it.notes||'').toLowerCase().includes(q))
      res.push({type:'itinerary', title:it.title, sub:`${fmtDate(it.date)}${it.time?' · '+it.time:''}`});
  });
  db.getPosts().forEach(p=>{
    const text=((p.title||'')+' '+p.body).toLowerCase();
    if(text.includes(q)||(p.author||'').toLowerCase().includes(q))
      res.push({type:'community', title:p.title||p.body.slice(0,50), sub:`${p.category} · ${p.author||'Anonymous'}`});
  });
  return res;
}

function searchGo(tab) { closeSearch(); showTab(tab) }

// ── Notifications ─────────────────────────────────────────────────────────────
function initNotifications() {
  updateNotifBtn();
  if(typeof Notification!=='undefined' && Notification.permission==='granted') {
    checkNotifications();
    setInterval(checkNotifications, 3600000);
  }
}

function updateNotifBtn() {
  const btn=document.getElementById('notif-btn');
  if(!btn) return;
  if(typeof Notification==='undefined'){ btn.style.display='none'; return; }
  const p=Notification.permission;
  btn.classList.toggle('active', p==='granted');
  btn.title = p==='granted' ? 'Reminders enabled' : p==='denied' ? 'Reminders blocked in browser settings' : 'Enable event reminders';
  btn.style.opacity = p==='denied' ? '.45' : '1';
}

function handleNotifBtn() {
  if(typeof Notification==='undefined'){ toast('Notifications not supported','err'); return; }
  const p=Notification.permission;
  if(p==='granted'){ toast('Event reminders are enabled','ok'); return; }
  if(p==='denied') { toast('Reminders are blocked — check your browser site settings','err'); return; }
  Notification.requestPermission().then(perm=>{
    updateNotifBtn();
    if(perm==='granted'){
      toast('Event reminders enabled!','ok');
      checkNotifications();
      setInterval(checkNotifications, 3600000);
    } else {
      toast('Reminders not enabled','err');
    }
  });
}

function checkNotifications() {
  if(typeof Notification==='undefined'||Notification.permission!=='granted') return;
  const today=todayStr();
  const state=JSON.parse(localStorage.getItem('tp_notif_state')||'{}');
  let changed=false;
  db.getEvents().forEach(ev=>{
    const days=daysUntil(ev.event_date);
    if(days<0) return;
    [7,3,1,0].forEach(t=>{
      if(days===t){
        const key=`${ev.id}_${t}`;
        if(state[key]!==today){
          const title=t===0?`Today: ${ev.name}`:`${ev.name} — ${t} day${t===1?'':'s'} away`;
          const body=t===0?`Your event is today (${fmtDate(ev.event_date)})`:`Coming up on ${fmtDate(ev.event_date)}`;
          try{ new Notification(title,{body,tag:key}) }catch(e){}
          state[key]=today; changed=true;
        }
      }
    });
  });
  if(changed) localStorage.setItem('tp_notif_state',JSON.stringify(state));
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function loadDashboard() {
  const el=document.getElementById('tab-dashboard');
  const today=todayStr();

  const events     = db.getEvents();
  const expenses   = db.getExpenses();
  const categories = db.getCategories().map(c=>({...c,spent:catSpent(c.id)}));
  const workouts   = db.getWorkouts();
  const items      = db.getChecklist();

  const upcoming = events.filter(e=>e.event_date>=today);
  const nextEv   = upcoming[0]||null;
  const nextDays = nextEv?daysUntil(nextEv.event_date):null;

  const totalBudget = categories.reduce((s,c)=>s+c.budget,0);
  const totalSpent  = expenses.reduce((s,e)=>s+e.amount,0);
  const moneyPct    = totalBudget>0?Math.min(totalSpent/totalBudget*100,100):0;
  const remaining   = totalBudget-totalSpent;

  const thisWeek  = workouts.filter(w=>w.date>=weekStart()).length;

  const totalItems  = items.length;

  const moneyCard=`
    <div class="stat-value" style="color:${moneyPct>90?'var(--danger)':'inherit'}">£${totalSpent.toFixed(0)}</div>
    <div class="stat-sub">of £${totalBudget.toFixed(0)}</div>
    <div style="margin-top:10px"><div class="progress-bar"><div class="pbar-fill ${pbarClass(moneyPct)}" style="width:${moneyPct}%"></div></div></div>

      ${remaining>=0?`£${remaining.toFixed(0)} left`:`£${Math.abs(remaining).toFixed(0)} over`}

  const fitCard=`
    <div class="stat-value">${thisWeek}</div>

  const packCard=`
    <div class="stat-value">${packPct}<span style="font-size:18px;font-weight:600">%</span></div>
    <div class="stat-sub">${packedItems} / ${totalItems} packed</div>
    <div style="margin-top:10px"><div class="progress-bar"><div class="pbar-fill pbar-green" style="width:${packPct}%"></div></div></div>`;

  // Detail sections
  let eventsDetail='';
  if(upcoming.length){
    const rows=upcoming.slice(0,4).map(ev=>{
      const days=daysUntil(ev.event_date);
      const roster=db.getRoster(ev.id);
      const conf=roster.filter(m=>m.confirmed).length;
      const rPct=roster.length>0?Math.round(conf/roster.length*100):0;
      const itin=db.getItinerary(ev.id);
      return `
        <div style="padding:10px 0;border-bottom:1px solid var(--border)">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
            <div style="min-width:0">
              <div style="font-weight:600;font-size:14px${ev.id===nextEv?.id?';color:var(--accent)':''};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(ev.name)}</div>
              <div style="font-size:12px;color:var(--muted)">${fmtDate(ev.event_date)}${itin.length?` · ${itin.length} schedule item${itin.length===1?'':'s'}`:''}</div>
            </div>
            <div style="text-align:right;flex-shrink:0">
              <div style="font-size:22px;font-weight:800;color:${days<=7&&days>=0?'var(--warning)':'var(--accent)'}">${days>=0?days:'—'}</div>
              <div style="font-size:11px;color:var(--muted)">${days>=0?'days':'ago'}</div>
            </div>
          </div>
          ${roster.length?`
            <div style="margin-top:7px;display:flex;align-items:center;gap:8px">
              <div class="progress-bar" style="flex:1"><div class="pbar-fill pbar-green" style="width:${rPct}%"></div></div>
              <div style="font-size:11px;color:var(--muted);white-space:nowrap">${conf}/${roster.length} confirmed</div>
            </div>`:''}
        </div>`;
    }).join('');
    eventsDetail=`<div class="card"><div class="card-title">Upcoming Events</div>${rows}</div>`;
  }

  let budgetDetail='';
  if(categories.length){
    const rows=categories.slice(0,6).map(c=>{
      const pct=c.budget>0?Math.min(c.spent/c.budget*100,100):0;
      return `
        <div style="margin-bottom:9px">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
            <span style="font-weight:500">${esc(c.name)}</span>
            <span style="color:${pct>100?'var(--danger)':pct>80?'var(--warning)':'var(--muted)'}">£${c.spent.toFixed(0)} / £${c.budget.toFixed(0)}</span>
          </div>
          <div class="progress-bar"><div class="pbar-fill ${pbarClass(pct)}" style="width:${pct}%"></div></div>
        </div>`;
    }).join('');
    const leftover=totalBudget-totalSpent;
    budgetDetail=`
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:4px">
          <div class="card-title" style="margin-bottom:0">Budget Breakdown</div>
          <span style="font-size:13px;font-weight:700;color:${leftover<0?'var(--danger)':'var(--success)'}">

          </span>
        </div>${rows}
      </div>`;

  let fitnessDetail='';
  if(workouts.length){
    const rows=lastThree.map(w=>`
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
        <span class="badge badge-blue" style="min-width:44px;text-align:center">${esc(w.type)}</span>
        <span style="flex:1;font-size:14px">${w.duration_min?w.duration_min+' min':'—'}</span>
        <span style="font-size:12px;color:var(--muted)">${fmtDate(w.date)}</span>
      </div>`).join('');
    fitnessDetail=`
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:4px">
          <div class="card-title" style="margin-bottom:0">Recent Workouts</div>

        </div>${rows}
        ${workouts.length>3?`<div style="font-size:12px;color:var(--muted);padding-top:8px">+${workouts.length-3} more in Fitness tab</div>`:''}
      </div>`;

  let packingDetail='';

    const rows=catPackStats.slice(0,6).map(({cat,packed,total})=>{
      const pct=Math.round(packed/total*100), done=packed===total;

function toggleRoster(id) {
  const b=document.getElementById(`roster-body-${id}`);
  if(b.style.display!=='none'){ b.style.display='none'; return; }
  b.style.display='block'; renderRosterBody(id);
}

function renderRosterBody(eventId) {
  const body=document.getElementById(`roster-body-${eventId}`);
  const members=db.getRoster(eventId);
  const listHtml=members.length
    ?members.map(m=>`
        <div class="roster-member">
          <input type="checkbox" ${m.confirmed?'checked':''} onchange="toggleConfirmed(${m.id},this.checked)">
          <span class="roster-name">${esc(m.name)}</span>
          ${m.role?`<span class="badge badge-blue">${esc(m.role)}</span>`:''}
          <button class="btn btn-danger btn-xs" onclick="deleteRosterMember(${m.id},${eventId})">✕</button>
        </div>`).join('')
    :`<p style="font-size:13px;color:var(--muted);padding:6px 0">No members yet.</p>`;

  body.innerHTML=`
    <div class="roster-body">
      ${listHtml}
      <div class="form-row" style="margin-top:10px">
        <input id="rm-name-${eventId}" placeholder="Name" style="flex:1">
        <input id="rm-role-${eventId}" placeholder="Role" style="width:120px">
        <button class="btn btn-primary btn-sm" onclick="addRosterMember(${eventId})">Add</button>
      </div>
    </div>`;
}

function addEvent() {
  const name=document.getElementById('ev-name').value.trim();
  const date=document.getElementById('ev-date').value;
  const desc=document.getElementById('ev-desc').value.trim();
  if(!name||!date){ toast('Name and date required','err'); return; }
  db.addEvent({name,event_date:date,description:desc});
  toast('Event added','ok'); loadRoster();
}

function deleteEvent(id) {
  if(!confirm('Delete this event, its roster and its itinerary?')) return;
  db.deleteEvent(id); toast('Event deleted'); loadRoster();
}

function addRosterMember(eventId) {
  const name=document.getElementById(`rm-name-${eventId}`).value.trim();
  const role=document.getElementById(`rm-role-${eventId}`).value.trim();
  if(!name){ toast('Name required','err'); return; }
  db.addMember({event_id:eventId,name,role,confirmed:0});
  renderRosterBody(eventId);
  const r=db.getRoster(eventId), c=r.filter(m=>m.confirmed).length;
  const btn=document.querySelector(`#ev-${eventId} .btn-ghost`);
  if(btn) btn.textContent=`Roster (${c}/${r.length})`;
}

function toggleConfirmed(memberId,confirmed) {
  db.updateMember(memberId,{confirmed:confirmed?1:0});
}

function deleteRosterMember(memberId,eventId) {
  db.deleteMember(memberId); renderRosterBody(eventId);
  const r=db.getRoster(eventId), c=r.filter(m=>m.confirmed).length;
  const btn=document.querySelector(`#ev-${eventId} .btn-ghost`);
  if(btn) btn.textContent=`Roster (${c}/${r.length})`;
}

// ── Money Tracker ─────────────────────────────────────────────────────────────
function loadMoney() {
  const el=document.getElementById('tab-money');
  const categories=db.getCategories(), expenses=db.getExpenses();
  const cws=categories.map(c=>({...c,spent:catSpent(c.id)}));
  const totalBudget=cws.reduce((s,c)=>s+c.budget,0);
  const totalSpent=expenses.reduce((s,e)=>s+e.amount,0);
  const overallPct=totalBudget>0?Math.min(totalSpent/totalBudget*100,100):0;
  const catOpts=categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');

  el.innerHTML=`
    <div class="section-header"><h2>Money Tracker</h2></div>
    <div class="card" style="margin-bottom:18px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;flex-wrap:wrap;gap:4px">
        <span class="card-title" style="margin-bottom:0">Overall Budget</span>
        <span style="font-weight:700;font-size:15px">£${totalSpent.toFixed(2)} / £${totalBudget.toFixed(2)}</span>
      </div>
      <div class="progress-bar" style="height:11px"><div class="pbar-fill ${pbarClass(overallPct)}" style="width:${overallPct}%"></div></div>
    </div>
    <div class="cat-grid">
      ${cws.map(c=>{
        const pct=c.budget>0?Math.min(c.spent/c.budget*100,100):0;
        return `
          <div class="cat-card">
            <div class="cat-card-header"><span class="cat-name">${esc(c.name)}</span>
              <button class="btn btn-danger btn-xs" onclick="deleteCategory(${c.id})">✕</button>
            </div>
            <div class="cat-amount">£${c.spent.toFixed(2)} of £${c.budget.toFixed(2)}</div>
            <div class="progress-bar"><div class="pbar-fill ${pbarClass(pct)}" style="width:${pct}%"></div></div>
          </div>`;
      }).join('')||`<p style="color:var(--muted);font-size:14px">No categories yet.</p>`}
    </div>
    <div class="form-grid-2">
      <div class="card">
        <div class="card-title" style="margin-bottom:12px">Add Category</div>
        <div class="form-row">
          <input id="cat-name" placeholder="Category name" style="flex:1">
          <input id="cat-budget" type="number" step="0.01" min="0" placeholder="Budget £" style="width:120px">
        </div>
        <div class="form-row"><button class="btn btn-primary" style="width:100%" onclick="addCategory()">Add Category</button></div>
      </div>
      <div class="card">
        <div class="card-title" style="margin-bottom:12px">Log Expense</div>
        <div class="form-row">
          <input id="exp-desc" placeholder="Description" style="flex:1">
          <input id="exp-amount" type="number" step="0.01" min="0" placeholder="£" style="width:90px">
        </div>
        <div class="form-row">
          <select id="exp-cat" style="flex:1"><option value="">No category</option>${catOpts}</select>
          <input id="exp-date" type="date" style="width:150px">
        </div>
        <div class="form-row"><button class="btn btn-primary" style="width:100%" onclick="addExpense()">Log Expense</button></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title" style="margin-bottom:12px">Expenses</div>
      ${expenses.length?`
        <div class="table-wrap"><table>
          <thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th></th></tr></thead>
          <tbody>${expenses.map(e=>`
            <tr>
              <td style="white-space:nowrap">${fmtDate(e.date)}</td>
              <td>${esc(e.description)}</td>
              <td><span class="badge badge-gray">${esc(catName(e.category_id))}</span></td>
              <td style="white-space:nowrap">£${e.amount.toFixed(2)}</td>
              <td><button class="btn btn-danger btn-xs" onclick="deleteExpense(${e.id})">✕</button></td>
            </tr>`).join('')}
          </tbody>
        </table></div>`:`<div class="empty-state">No expenses logged yet.</div>`}
    </div>`;
  document.getElementById('exp-date').value=todayStr();
}

function addCategory() {
  const name=document.getElementById('cat-name').value.trim();
  const budget=parseFloat(document.getElementById('cat-budget').value)||0;
  if(!name){ toast('Category name required','err'); return; }
  db.addCategory({name,budget}); toast('Category added','ok'); loadMoney();
}
function deleteCategory(id) {
  if(!confirm('Delete category? Expenses become uncategorized.')) return;
  db.deleteCategory(id); toast('Category deleted'); loadMoney();
}
function addExpense() {
  const desc=document.getElementById('exp-desc').value.trim();
  const amount=parseFloat(document.getElementById('exp-amount').value);
  const catId=document.getElementById('exp-cat').value;
  const date=document.getElementById('exp-date').value;
  if(!desc||!amount||!date){ toast('Description, amount and date required','err'); return; }
  db.addExpense({description:desc,amount,category_id:catId?parseInt(catId):null,date});
  toast('Expense logged','ok'); loadMoney();
}
function deleteExpense(id) { db.deleteExpense(id); toast('Expense deleted'); loadMoney() }

// ── Fitness Tracker ───────────────────────────────────────────────────────────
function loadFitness() {
  const el=document.getElementById('tab-fitness');
  const workouts=db.getWorkouts();
  const thisWeek=workouts.filter(w=>w.date>=weekStart()).length;
  const totMins=workouts.reduce((s,w)=>s+w.duration_min,0);
  const types=new Set(workouts.map(w=>w.type)).size;
  const streak=calcStreak(workouts);

  el.innerHTML=`
    <div class="section-header"><h2>Fitness Tracker</h2></div>
    <div class="stats-row">
      <div class="stat-mini"><div class="stat-mini-val">${workouts.length}</div><div class="stat-mini-label">Total</div></div>
      <div class="stat-mini"><div class="stat-mini-val">${thisWeek}</div><div class="stat-mini-label">This Week</div></div>
      <div class="stat-mini"><div class="stat-mini-val">${streak}</div><div class="stat-mini-label">Streak</div></div>
      <div class="stat-mini"><div class="stat-mini-val">${totMins}</div><div class="stat-mini-label">Minutes</div></div>
      <div class="stat-mini"><div class="stat-mini-val">${types}</div><div class="stat-mini-label">Types</div></div>
    </div>
    <div class="card" style="margin-bottom:18px">
      <div class="card-title" style="margin-bottom:12px">Log Workout</div>
      <div class="form-row">
        <input id="wo-date" type="date" style="width:155px">
        <select id="wo-type" style="flex:1">
          <option>Run</option><option>Lift</option><option>Swim</option>
          <option>Cycle</option><option>HIIT</option><option>Walk</option>
          <option>Yoga</option><option>Sport</option><option>Other</option>
        </select>
        <input id="wo-dur" type="number" min="0" placeholder="Duration (min)" style="width:150px">
      </div>
      <div class="form-row">
        <input id="wo-notes" placeholder="Notes (optional)" style="flex:1">
        <button class="btn btn-primary" onclick="addWorkout()">Log</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title" style="margin-bottom:12px">Workout Log</div>
      ${workouts.length?`
        <div class="table-wrap"><table>
          <thead><tr><th>Date</th><th>Type</th><th>Duration</th><th>Notes</th><th></th></tr></thead>
          <tbody>${workouts.map(w=>`
            <tr>
              <td style="white-space:nowrap">${fmtDate(w.date)}</td>
              <td><span class="badge badge-blue">${esc(w.type)}</span></td>
              <td style="white-space:nowrap">${w.duration_min?w.duration_min+' min':'—'}</td>
              <td style="color:var(--muted)">${esc(w.notes)||'—'}</td>
              <td><button class="btn btn-danger btn-xs" onclick="deleteWorkout(${w.id})">✕</button></td>
            </tr>`).join('')}
          </tbody>
        </table></div>`:`<div class="empty-state">No workouts logged yet.</div>`}
    </div>`;
  document.getElementById('wo-date').value=todayStr();
}

function addWorkout() {
  const date=document.getElementById('wo-date').value;
  const type=document.getElementById('wo-type').value;
  const dur=parseInt(document.getElementById('wo-dur').value)||0;
  const notes=document.getElementById('wo-notes').value.trim();
  if(!date){ toast('Date required','err'); return; }
  db.addWorkout({date,type,duration_min:dur,notes});
  toast('Workout logged','ok'); loadFitness();
}
function deleteWorkout(id) { db.deleteWorkout(id); toast('Workout deleted'); loadFitness() }

// ── Packing Checklist ─────────────────────────────────────────────────────────
function loadPacking() {
  const el=document.getElementById('tab-packing');
  const items=db.getChecklist();
  const total=items.length, packed=items.filter(i=>i.packed).length;
  const pct=total>0?Math.round(packed/total*100):0;
  const groups={};
  items.forEach(i=>{ (groups[i.category]??=[]).push(i) });
  const groupHtml=Object.entries(groups).map(([cat,its])=>`
    <div class="checklist-section">
      <div class="checklist-cat-title">${esc(cat)}</div>
      ${its.map(item=>`
        <div class="checklist-item">
          <input type="checkbox" ${item.packed?'checked':''} onchange="toggleCheckItem(${item.id})">
          <span class="item-name${item.packed?' done':''}">${esc(item.name)}</span>
          <button class="btn btn-xs" style="background:transparent;color:var(--muted);min-height:0" onclick="deleteCheckItem(${item.id})">✕</button>
        </div>`).join('')}
    </div>`).join('');
  const existingCats=[...new Set(items.map(i=>i.category))];
  const suggestions=[...new Set([...existingCats,'Clothing','Toiletries','Electronics','Documents','Gear','Food','Other'])];

  el.innerHTML=`
    <div class="section-header">
      <h2>Packing Checklist</h2>
      ${total?`<button class="btn btn-ghost btn-sm" onclick="clearChecklist()">Clear all</button>`:''}
    </div>
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;flex-wrap:wrap;gap:4px">
        <span class="card-title" style="margin-bottom:0">Progress</span>
        <span style="font-weight:700">${packed} / ${total} packed (${pct}%)</span>
      </div>
      <div class="progress-bar" style="height:11px"><div class="pbar-fill pbar-green" style="width:${pct}%"></div></div>
    </div>
    <div class="card" style="max-width:540px;margin-bottom:22px">
      <div class="card-title" style="margin-bottom:12px">Add Item</div>
      <div class="form-row">
        <input id="item-name" placeholder="Item name" style="flex:1">
        <input id="item-cat" placeholder="Category" style="width:145px" list="cat-list">
        <datalist id="cat-list">${suggestions.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
        <button class="btn btn-primary" onclick="addCheckItem()">Add</button>
      </div>
    </div>
    ${total?`<div class="card">${groupHtml}</div>`:`<div class="empty-state">No items yet — add some above.</div>`}`;
}

function toggleCheckItem(id) { db.toggleItem(id); loadPacking() }
function deleteCheckItem(id) { db.deleteItem(id); loadPacking() }
function addCheckItem() {
  const name=document.getElementById('item-name').value.trim();
  const cat=document.getElementById('item-cat').value.trim()||'General';
  if(!name){ toast('Item name required','err'); return; }
  db.addCheckItem({name,category:cat}); toast('Item added','ok'); loadPacking();
}
function clearChecklist() {
  if(!confirm('Remove all checklist items?')) return;
  db.clearChecklist(); toast('Checklist cleared'); loadPacking();
}

// ── Itinerary ─────────────────────────────────────────────────────────────────
function loadItinerary() {
  const el=document.getElementById('tab-itinerary');
  const events=db.getEvents();

  if(!events.length){
    el.innerHTML=`
      <div class="section-header"><h2>Itinerary</h2></div>
      <div class="empty-state">No events yet — add one in <strong>Roster Countdown</strong> first.</div>`;
    return;
  }

  let selId=parseInt(localStorage.getItem('tp_itin_sel')||'0');
  if(!events.find(e=>e.id===selId)) selId=events[0].id;
  const selEv=events.find(e=>e.id===selId);
  const items=db.getItinerary(selId);

  const byDate={};
  items.forEach(i=>{ (byDate[i.date]??=[]).push(i) });

  const scheduleHtml=Object.keys(byDate).sort().length
    ?Object.keys(byDate).sort().map(date=>{
        const slots=byDate[date];
        return `
          <div>
            <div class="itin-day-label">${new Date(date+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</div>
            ${slots.map(s=>`
              <div class="itin-item">
                <div class="itin-time">${s.time||'—'}</div>
                <div class="itin-body">
                  <div class="itin-title">${esc(s.title)}</div>
                  ${s.location?`<div class="itin-location">📍 ${esc(s.location)}</div>`:''}
                  ${s.notes?`<div class="itin-notes">${esc(s.notes)}</div>`:''}
                </div>
                <button class="btn btn-danger btn-xs" onclick="deleteItinItem(${s.id})">✕</button>
              </div>`).join('')}
          </div>`;
      }).join('')
    :`<div class="empty-state">No schedule added for this event yet.</div>`;

  const evOpts=events.map(ev=>`<option value="${ev.id}"${ev.id===selId?' selected':''}>${esc(ev.name)} · ${fmtDate(ev.event_date)}</option>`).join('');

  el.innerHTML=`
    <div class="section-header">
      <h2>Itinerary</h2>
      <span style="font-size:12px;color:var(--muted)">${items.length} item${items.length===1?'':'s'}</span>
    </div>

    <div style="margin-bottom:20px">
      <select onchange="selectItinEvent(parseInt(this.value))" style="width:100%;max-width:420px">${evOpts}</select>
    </div>

    <div class="itin-schedule">${scheduleHtml}</div>

    <hr class="divider">
    <div class="card" style="max-width:540px">
      <div class="card-title" style="margin-bottom:12px">Add Schedule Item</div>
      <div class="form-row">
        <input id="itin-date" type="date" style="width:155px">
        <input id="itin-time" type="time" style="width:130px">
        <input id="itin-title" placeholder="Title" style="flex:1;min-width:120px">
      </div>
      <div class="form-row">
        <input id="itin-location" placeholder="Location (optional)" style="flex:1">
        <input id="itin-notes" placeholder="Notes (optional)" style="flex:1">
      </div>
      <div class="form-row">
        <button class="btn btn-primary" style="width:100%" onclick="addItinItem(${selId})">Add to Schedule</button>
      </div>
    </div>`;

  const defaultDate=selEv&&selEv.event_date>=todayStr()?selEv.event_date:todayStr();
  document.getElementById('itin-date').value=defaultDate;
}

function selectItinEvent(id) { localStorage.setItem('tp_itin_sel',id); loadItinerary() }

function addItinItem(eventId) {
  const date =document.getElementById('itin-date').value;
  const time =document.getElementById('itin-time').value;
  const title=document.getElementById('itin-title').value.trim();
  const loc  =document.getElementById('itin-location').value.trim();
  const notes=document.getElementById('itin-notes').value.trim();
  if(!date||!title){ toast('Date and title required','err'); return; }
  db.addItinItem({event_id:eventId,date,time,title,location:loc,notes});
  toast('Added to schedule','ok'); loadItinerary();
}

function deleteItinItem(id) { db.deleteItinItem(id); toast('Removed'); loadItinerary() }

// ── Community ─────────────────────────────────────────────────────────────────
let _commRating=0;

const CAT_META={
  camp:{label:'Camp',  icon:'🏕️', badge:'badge-blue'},
  food:{label:'Food',  icon:'🍽️', badge:'badge-green'},
  gym: {label:'Gym',   icon:'🏋️', badge:'badge-yellow'},
  room:{label:'Room',  icon:'🛏️', badge:'badge-gray'},
  tip: {label:'Tip',   icon:'💡', badge:'badge-blue'},
};

function starsHtml(r) {
  if(!r) return '';
  return `<span class="stars">${'★'.repeat(r)}${'☆'.repeat(5-r)}</span>`;
}

function loadCommunity() {
  const el=document.getElementById('tab-community');
  const filter=localStorage.getItem('tp_comm_filter')||'all';
  const posts=db.getPosts(filter);

  const PILLS=[
    {k:'all', label:'All'},
    {k:'camp',label:'🏕️ Camps'},
    {k:'food',label:'🍽️ Food'},
    {k:'gym', label:'🏋️ Gyms'},
    {k:'room',label:'🛏️ Rooms'},
    {k:'tip', label:'💡 Tips'},
  ];

  const pillsHtml=PILLS.map(p=>`
    <button class="pill${filter===p.k?' active':''}" onclick="setCommunityFilter('${p.k}')">${p.label}</button>`).join('');

  const postsHtml=posts.length
    ?posts.map(p=>{
        const meta=CAT_META[p.category]||{label:p.category,icon:'',badge:'badge-gray'};
        return `
          <div class="comm-card">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:6px">
              <span class="badge ${meta.badge}" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px">${meta.icon} ${meta.label}</span>
              ${starsHtml(p.rating)}
            </div>
            ${p.title?`<div class="comm-title">${esc(p.title)}</div>`:''}
            <div class="comm-body">${esc(p.body)}</div>
            <div class="comm-footer">
              <span class="comm-author">${esc(p.author||'Anonymous')} · ${fmtDate(p.date)}</span>
              <button class="btn btn-danger btn-xs" onclick="deletePost(${p.id})">✕</button>
            </div>
          </div>`;
      }).join('')
    :`<div class="empty-state" style="grid-column:1/-1">No posts yet — be the first to share!</div>`;

  el.innerHTML=`
    <div class="section-header"><h2>FIFO Community</h2>
      <span style="font-size:12px;color:var(--muted)">${posts.length} post${posts.length===1?'':'s'}</span>
    </div>
    <div class="filter-pills">${pillsHtml}</div>
    <div class="comm-grid">${postsHtml}</div>
    <hr class="divider">
    <div class="card" style="max-width:540px">
      <div class="card-title" style="margin-bottom:12px">Share a Review or Tip</div>
      <div class="form-row">
        <select id="comm-cat" style="flex:1" onchange="communityTypeChange()">
          <option value="camp">🏕️ Camp Review</option>
          <option value="food">🍽️ Food Review</option>
          <option value="gym">🏋️ Gym Review</option>
          <option value="room">🛏️ Room Review</option>
          <option value="tip">💡 Tip / Info</option>
        </select>
        <input id="comm-author" placeholder="Your name" style="width:140px">
      </div>
      <div class="form-row">
        <input id="comm-title" placeholder="Location or subject, e.g. Camp 3 gym" style="flex:1">
      </div>
      <div class="form-row" id="comm-rating-row" style="align-items:center;gap:4px">
        <span style="font-size:13px;color:var(--muted);margin-right:4px">Rating:</span>
        ${[1,2,3,4,5].map(n=>`<button class="comm-star" data-val="${n}" onclick="setRating(${n})" style="background:none;border:none;cursor:pointer;font-size:22px;padding:0 3px;color:#d1d5db;line-height:1">★</button>`).join('')}
      </div>
      <div class="form-row">
        <textarea id="comm-body" placeholder="Write your review or tip… e.g. Camp gym has squat rack and dumbbells to 40kg." style="flex:1;min-height:90px;resize:vertical"></textarea>
      </div>
      <div class="form-row">
        <button class="btn btn-primary" style="width:100%" onclick="addPost()">Post</button>
      </div>
    </div>`;

  _commRating=0;
  const savedName=localStorage.getItem('tp_comm_author')||'';
  document.getElementById('comm-author').value=savedName;
}

function setCommunityFilter(cat) {
  localStorage.setItem('tp_comm_filter',cat);
  loadCommunity();
}

function communityTypeChange() {
  const t=document.getElementById('comm-cat')?.value;
  const row=document.getElementById('comm-rating-row');
  if(row) row.style.display=t==='tip'?'none':'';
}

function setRating(n) {
  _commRating=n;
  document.querySelectorAll('.comm-star').forEach(btn=>{
    btn.style.color=parseInt(btn.dataset.val)<=n?'#f59e0b':'#d1d5db';
  });
}

function addPost() {
  const cat=document.getElementById('comm-cat')?.value;
  const author=document.getElementById('comm-author')?.value.trim();
  const title=document.getElementById('comm-title')?.value.trim();
  const body=document.getElementById('comm-body')?.value.trim();
  if(!body){ toast('Please write something first','err'); return; }
  const rating=cat==='tip'?null:(_commRating||null);
  if(author) localStorage.setItem('tp_comm_author',author);
  db.addPost({category:cat,title,body,rating,author,date:todayStr()});
  toast('Posted!','ok'); loadCommunity();
}

function deletePost(id) {
  if(!confirm('Delete this post?')) return;
  db.deletePost(id); toast('Post deleted'); loadCommunity();
}

// ── Init ──────────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){ e.preventDefault(); openSearch(); }
  if(e.key==='Escape'&&document.getElementById('search-overlay').classList.contains('open')) closeSearch();
});

showTab(location.hash.slice(1)||'dashboard');
initNotifications();
</script>
