[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "fifo-worker"
version = "0.1.0"
description = "SQLite-backed FIFO job queue worker"
requires-python = ">=3.11"

[project.scripts]
fifo-worker = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
